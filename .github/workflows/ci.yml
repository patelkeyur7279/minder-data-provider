name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, test, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Node 20 (maintenance LTS) + 22 (active LTS). Node 18 was dropped:
        # it went EOL 2025-04 and, more concretely, lacks a global WebCrypto
        # (`crypto.subtle`) — which the edge-safe webhook HMAC verification in
        # src/server/webhooks.ts requires. WebCrypto is global on Node 20+ and
        # on every edge/browser/Deno/Bun runtime, so 20 is the honest floor.
        node-version: [20, 22]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint:check

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --coverage
      
      - name: Build
        run: npm run build

      - name: Verify public API surface unchanged
        run: npm run verify:api

      - name: Verify consumer tree-shaking
        run: npm run verify:treeshake

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
