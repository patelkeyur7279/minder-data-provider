name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, test, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Node 20 (maintenance LTS) + 22 (active LTS). Node 18 was dropped:
        # it went EOL 2025-04 and, more concretely, lacks a global WebCrypto
        # (`crypto.subtle`) — which the edge-safe webhook HMAC verification in
        # src/server/webhooks.ts requires. WebCrypto is global on Node 20+ and
        # on every edge/browser/Deno/Bun runtime, so 20 is the honest floor.
        node-version: [20, 22]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint:check

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- --coverage
      
      - name: Build
        run: npm run build

      - name: Verify public API surface unchanged
        run: npm run verify:api

      - name: Verify consumer tree-shaking
        run: npm run verify:treeshake

      - name: Check bundle budgets
        run: npm run budgets:check

      - name: Run benchmarks (report-only — trend line, no thresholds yet)
        run: npm run bench

      - name: Upload coverage
        id: coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Support-Matrix evidence: Next.js App Router (provider-wrapper pattern).
  # Builds the packed library, installs it into the example exactly like a real
  # consumer, next-builds it (incl. static prerender), and runtime-smokes both
  # the page and the API route.
  app-router-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build library
        run: npm ci && npm run build

      - name: Pack library tarball
        run: npm pack

      - name: Install and build example
        working-directory: examples/nextjs-app-router
        run: npm install && npm run build

      - name: Runtime smoke (page + API route)
        working-directory: examples/nextjs-app-router
        run: |
          npx next start -p 3199 &
          sleep 5
          curl -sf http://127.0.0.1:3199/api/users | grep -q "Ada"
          curl -sf http://127.0.0.1:3199/ | grep -q "App Router example"
