name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only in this repo, so the final push to
    # the .wiki.git 403'd — the wiki-sync had been failing on every run. Grant
    # write so the token can push the wiki. (If it still fails, a PAT secret
    # with repo scope is the fallback.)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync Wiki
        run: |
          echo "Configuring git..."
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          echo "Cloning wiki repo..."
          # Clone the wiki repository
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki_repo

          echo "Syncing files..."
          # Clean wiki repo (except .git) to ensure deleted files are removed
          cd wiki_repo
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
          cd ..

          # Build the numbered documentation book from docs/ (single source of
          # truth, never modified) straight into the cleaned wiki repo. The
          # generator itself fails the job (non-zero exit) if a docs/*.md file
          # is uncurated (neither listed nor excluded in wiki-book.json) or if
          # any generated link is broken — see scripts/build-wiki.mjs.
          # --branch must match the branch this workflow syncs FROM (main is
          # production per .github/BRANCH_STRATEGY.md) — it feeds cross-repo
          # blob links and the Home page's CI-status badge. Passing
          # github.ref_name keeps it correct even if the production branch is
          # ever renamed, and for a manual workflow_dispatch run it reflects
          # whichever ref the run was triggered on.
          node scripts/build-wiki.mjs --out wiki_repo --branch "${{ github.ref_name }}"

          echo "Committing changes..."
          cd wiki_repo
          git add .
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: sync from ${{ github.ref_name }} [skip ci]"
            git push origin master
            echo "Wiki updated successfully."
          else
            echo "No changes to sync."
          fi
